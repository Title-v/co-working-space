<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183d33">
  <title>สมัครสมาชิก · SpaceHub</title>
  <link rel="stylesheet" href="/space.css">
</head>
<body data-page="register">
  <a class="skip" href="#main">ข้ามไปเนื้อหา</a>
  <header id="site-header"></header>
  <main id="main" class="shell">
  <div class="account-wrap"><div class="account-image" aria-hidden="true"><img src="/meeting_room.png" alt=""></div><section class="account-card">
    <p class="eyebrow ink-light">SPACEHUB ACCOUNT</p><h1>สร้างบัญชี</h1>
    <p class="muted">ใช้บัญชีนี้จองโต๊ะและจัดการวันเข้าใช้ของคุณ</p>
    <form id="account-form">
      <div class="two-fields"><label class="field">ชื่อ<input name="firstName" autocomplete="given-name" maxlength="100" required></label><label class="field">นามสกุล<input name="lastName" autocomplete="family-name" maxlength="100" required></label></div>
      <label class="field">เบอร์ติดต่อ<input type="tel" name="phone" autocomplete="tel" maxlength="30" required></label>
      <label class="field">อีเมล<input type="email" name="email" autocomplete="email" maxlength="254" required></label>
      <label class="field">รหัสผ่าน<input type="password" name="password" autocomplete="new-password" minlength="8" required><small>อย่างน้อย 8 ตัวอักษร</small></label>
      <p class="notice" id="account-message" role="alert" hidden></p><button class="primary" type="submit">สร้างบัญชี</button>
    </form><p class="form-tail">มีบัญชีอยู่แล้ว <a id="switch-account" href="/login.html">เข้าสู่ระบบ</a></p>
  </section></div></main>
  <footer class="footer shell"><b>SpaceHub</b><span>ระบบจองพื้นที่ทำงาน <i> / </i> เวลาประเทศไทย</span></footer>
  <script type="module" src="/account.js"></script>
</body>
</html>
