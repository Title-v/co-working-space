<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a73e8">
  <title>สร้างบัญชี · SpaceHub</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/space.css">
</head>
<body data-page="register">
  <a class="skip" href="#main">ข้ามไปเนื้อหา</a>
  <header id="site-header"></header>
  <main id="main" class="workspace workspace--account">
    <section class="auth-card account-form" aria-labelledby="account-title">
      <header class="auth-card__header">
        <h1 id="account-title" class="auth-card__title">สร้างบัญชี</h1>
        <p class="auth-card__subtitle">สมัครเพื่อจองโต๊ะและจัดการรายการจองของคุณ</p>
      </header>
      <form id="account-form">
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">ชื่อ</label>
            <input id="firstName" name="firstName" type="text" autocomplete="given-name" maxlength="100" required>
          </div>
          <div class="form-group">
            <label for="lastName">นามสกุล</label>
            <input id="lastName" name="lastName" type="text" autocomplete="family-name" maxlength="100" required>
          </div>
        </div>
        <div class="form-group">
          <label for="phone">เบอร์ติดต่อ</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="30" required>
        </div>
        <div class="form-group">
          <label for="email">อีเมล</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        </div>
        <div class="form-group">
          <label for="password">รหัสผ่าน</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" aria-describedby="password-hint" required>
          <small id="password-hint" class="fine-print">อย่างน้อย 8 ตัวอักษร</small>
        </div>
        <p id="account-message" class="notice" role="alert" hidden></p>
        <button class="btn-submit" type="submit">สร้างบัญชี</button>
      </form>
      <p class="auth-card__footer">มีบัญชีอยู่แล้ว <a id="switch-account" href="/login.html">เข้าสู่ระบบ</a></p>
    </section>
  </main>
  <script type="module" src="/account.js"></script>
</body>
</html>
