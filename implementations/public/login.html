<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a73e8">
  <title>เข้าสู่ระบบ · SpaceHub</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/space.css">
</head>
<body data-page="login">
  <a class="skip" href="#main">ข้ามไปเนื้อหา</a>
  <header id="site-header"></header>
  <main id="main" class="workspace workspace--account">
    <section class="auth-card account-form" aria-labelledby="account-title">
      <header class="auth-card__header">
        <h1 id="account-title" class="auth-card__title">เข้าสู่ระบบ</h1>
        <p class="auth-card__subtitle">เข้าสู่ระบบเพื่อจองโต๊ะหรือดูรายการจองของคุณ</p>
      </header>
      <form id="account-form">
        <div class="form-group">
          <label for="email">อีเมล</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        </div>
        <div class="form-group">
          <label for="password">รหัสผ่าน</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p id="account-message" class="notice" role="alert" hidden></p>
        <button class="btn-submit" type="submit">เข้าสู่ระบบ</button>
      </form>
      <p class="auth-card__footer">ยังไม่มีบัญชี <a id="switch-account" href="/register.html">สมัครสมาชิก</a></p>
    </section>
  </main>
  <script type="module" src="/account.js"></script>
</body>
</html>
