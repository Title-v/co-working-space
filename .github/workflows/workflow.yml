name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      sonar:
        description: Run the configured SonarCloud scan
        type: boolean
        default: false
      deploy:
        description: Publish the image and call the configured Render deploy hook
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────
  # CI — Lint, Test & Build Docker Image
  # ─────────────────────────────────────
  ci:
    name: CI — Lint & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: spacehub_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/spacehub_test
      BOOKING_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/spacehub_test
      BOOKING_TEST_URL: http://localhost:3000
      ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: implementations/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: |
          npm run build
          npm test

      - name: Exercise the reservation lifecycle against Postgres
        run: |
          npm start > "$RUNNER_TEMP/spacehub.log" 2>&1 &
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-connrefused http://localhost:3000/api/bookings/settings > /dev/null
          npm run test:booking

      - name: Build Docker image (test)
        run: docker build -t $(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]'):test ./implementations

  # ─────────────────────────────────────
  # SonarQube — Code Quality Analysis
  # ─────────────────────────────────────
  sonarqube:
    name: SonarQube Analysis
    if: github.event_name == 'workflow_dispatch' && inputs.sonar
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (for coverage parsing)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: implementations/package-lock.json

      - name: Install dependencies & run tests
        working-directory: ./implementations
        run: |
          npm ci
          npm test

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v5
        with:
          projectBaseDir: implementations
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ─────────────────────────────────────
  # CD — Push to GHCR & Deploy to Render
  # ─────────────────────────────────────
  deploy:
    name: CD — Deploy to Render
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./implementations
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✅ Deploy triggered on Render"
